version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: baas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: baas
      POSTGRES_PASSWORD: baas_dev
      POSTGRES_DB: baas_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U baas']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: baas-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes

volumes:
  pgdata:
  redisdata:
